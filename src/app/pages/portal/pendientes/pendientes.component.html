<div class="w-full flex flex-col gap-5 p-10">
  <!-- Breadcrumb -->
  <app-breadcrumb [path]="'Pendientes'"></app-breadcrumb>
  <!-- Top -->
  <div class="flex gap-5">
    <!-- Welcome -->
    <div class="bg-light rounded-xl w-full p-5">
      <div class="flex justify-between">
        <div>
          <h1 class="font-bold text-2xl">Pendientes</h1>
          <p class="text-neutral-500 text-sm">Lista de reportes pendientes registrados en el sistema.</p>
        </div>
        <div class="flex items-center gap-2">
          <button (click)="onAdd()" type="button" class="bg-green-600 hover:bg-green-600/90 text-white px-6 py-2 font-semibold rounded-lg">
            <fa-icon [icon]="Add"></fa-icon> Nuevo
          </button>
        </div>
      </div>
    </div>
    <!-- User -->
    <app-user-logout></app-user-logout>
  </div>
  <!-- Table -->
  <app-table [tableConstructor]="tableConstructor" [data]="pendientes()" [facultades]="facultades()"
    (onEdit)="onEdit($event)" (onDelete)="onDelete($event)" [send]="true"
  ></app-table>
</div>

@if (isPendienteModalOpen()) {
  <app-pendientes-modal
    [pendiente]="selectedPendiente()"
    (close)="isPendienteModalOpen.set(false)"
  ></app-pendientes-modal>
}

@if (isConfirmModalOpen()) {
  <app-confirm-modal
    [message]="{ section: 'Pendiente', element: selectedPendiente()?.report! }"
    (confirm)="confirmDelete()"
    (close)="isConfirmModalOpen.set(false)"
  ></app-confirm-modal>
}
